# Builds the self-host mobile app and uploads it to TestFlight.
#
# MANUAL ONLY for now: ms1 has no Xcode, so the scheduled/push uploads run
# from the development Mac instead (apps/mobile/scripts/testflight-cron.sh
# under launchd, monthly, reporting to Discord). Once Xcode + CocoaPods are
# on ms1, restore the triggers below:
#
#   push:
#     branches: [selfhost]
#     paths: ["apps/mobile/**", "packages/**", "patches/**", "package.json", "bun.lock"]
#   schedule:
#     - cron: "0 5 1 * *"   # monthly; TestFlight builds expire after 90 days
#
# Signing is cloud signing via the API key (role Admin), so no certificate
# lives on the runner. See apps/mobile/scripts/testflight.sh.
#
# Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (base64 of the .p8),
# APPLE_TEAM_ID, MOBILE_APP_ID, EXPO_PUBLIC_{API,WEB,RELAY}_URL (what
# apps/mobile/selfhost.env holds on a dev machine — see selfhost.env.example)
name: TestFlight (self-host mobile)

on:
  workflow_dispatch:

concurrency:
  group: testflight-mobile
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload
    if: github.repository == 'tomikng/superset'
    runs-on: [self-hosted, macOS, ms1]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: selfhost

      - name: Install dependencies
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile

      - name: Build and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MOBILE_APP_ID: ${{ secrets.MOBILE_APP_ID }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_WEB_URL: ${{ secrets.EXPO_PUBLIC_WEB_URL }}
          EXPO_PUBLIC_RELAY_URL: ${{ secrets.EXPO_PUBLIC_RELAY_URL }}
          MOBILE_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          # run_number is monotonic per workflow; offset it so it can never
          # collide with the timestamp-style numbers of local uploads.
          export MOBILE_BUILD_NUMBER=$((300000000000 + MOBILE_BUILD_NUMBER))
          apps/mobile/scripts/testflight.sh

      - name: Keep the .ipa
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: superset-mobile-${{ github.run_number }}
          path: |
            apps/mobile/build/export/*.ipa
            apps/mobile/build/*.log
          retention-days: 30
          if-no-files-found: ignore
