# Push-to-deploy for the self-host. Runs on the self-hosted runner that lives
# on ms3 itself (labels: self-hosted, Linux, ms3) and advances the live clone in
# place. ms3 replaced ms1 (macOS); ms1 keeps its runner for TestFlight only.
# deploy/deploy.sh handles both launchd (macOS) and systemd --user (Linux).
name: Deploy Self-host

on:
  push:
    branches: [selfhost]
  workflow_dispatch:

concurrency:
  group: deploy-selfhost
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ms3
    if: github.repository == 'tomikng/superset'
    runs-on: [self-hosted, Linux, ms3]
    timeout-minutes: 30
    env:
      SUPERSET_ROOT: srv/superset
    steps:
      # No actions/checkout: the deploy target is the live clone the systemd
      # services run from, not the runner's scratch workspace.
      - name: Advance the live clone
        id: advance
        run: |
          cd "$HOME/$SUPERSET_ROOT"
          [ -z "$(git status --porcelain)" ] || { echo "live clone is dirty" >&2; exit 1; }
          echo "prev=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git fetch -q fork selfhost
          git merge --ff-only "${{ github.sha }}"
          git log --oneline -1

      - name: Deploy
        run: |
          cd "$HOME/$SUPERSET_ROOT"
          mkdir -p ~/.local/state/superset
          deploy/deploy.sh "${{ steps.advance.outputs.prev }}" 2>&1 | tee -a ~/.local/state/superset/deploy.log
          exit "${PIPESTATUS[0]}"
